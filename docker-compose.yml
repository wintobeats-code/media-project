services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media_secret
      POSTGRES_DB: media_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://media:media_secret@db:5432/media_db
      SECRET_KEY: change-me-in-production-abc123
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      FRONTEND_DIR: /app/frontend
    volumes:
      - ./backend/app:/app/app
      - ./frontend:/app/frontend
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  uploads:
