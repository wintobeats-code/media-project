<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное — БОГЕМА</title>
    <meta name="description" content="Сохранённые статьи журнала БОГЕМА.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="БОГЕМА">
    <meta property="og:title" content="Избранное — БОГЕМА">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap">
    <link rel="stylesheet" href="/assets/css/styles.css?v=23">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📰</text></svg>">
    <script>
        (function () {
            try {
                var t = localStorage.getItem("media-theme");
                if (t !== "light" && t !== "dark") {
                    t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
                }
                document.documentElement.setAttribute("data-theme", t);
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="brand">БОГЕМА</a>
            <div class="header-tools">
                <button id="theme-toggle" class="icon-btn" type="button"
                        aria-label="Переключить тему" title="Переключить тему">
                    <span class="theme-icon" data-icon="sun" aria-hidden="true">☀</span>
                    <span class="theme-icon" data-icon="moon" aria-hidden="true">☾</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="feed-controls">
            <div class="controls-left">
                <h1 class="feed-title">Избранное</h1>
            </div>
        </section>

        <section id="favorites-grid" class="feed-grid" aria-label="Сохранённые статьи"></section>

        <div id="favorites-empty" class="feed-empty">
            <p>В избранном пока пусто.</p>
            <p>Нажимайте звёздочку на статье, чтобы сохранить её здесь.</p>
            <p style="margin-top:18px;"><a href="/" class="btn-outline">На главную</a></p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <span>© <span id="year"></span> БОГЕМА</span>
            <nav class="footer-links">
                <a href="/">Главная</a>
            </nav>
        </div>
    </footer>

    <template id="card-template">
        <article class="card fav-card">
            <a class="card-link" href="">
                <div class="card-media">
                    <img class="card-img" src="" alt="" loading="lazy">
                </div>
                <div class="card-body">
                    <div class="card-meta">
                        <span class="card-date"></span>
                    </div>
                    <h3 class="card-title"></h3>
                    <p class="card-lead"></p>
                    <div class="card-author">
                        <span class="author-name"></span>
                    </div>
                </div>
            </a>
            <button type="button" class="fav-remove" title="Убрать из избранного">Убрать</button>
        </article>
    </template>

    <script src="/assets/js/theme.js?v=23"></script>
    <script>
        (function () {
            "use strict";
            var FAV_KEY = "media-favorites";
            var grid = document.getElementById("favorites-grid");
            var empty = document.getElementById("favorites-empty");
            var tpl = document.getElementById("card-template");

            function getFavorites() {
                try { return JSON.parse(localStorage.getItem(FAV_KEY) || "{}"); }
                catch (e) { return {}; }
            }
            function saveFavorites(data) {
                try { localStorage.setItem(FAV_KEY, JSON.stringify(data)); } catch (e) {}
            }

            function formatDate(iso) {
                if (!iso) return "";
                var d = new Date(iso);
                if (isNaN(d.getTime())) return "";
                var m = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
                return d.getDate() + " " + m[d.getMonth()] + " " + d.getFullYear();
            }

            function render() {
                var favs = getFavorites();
                var items = Object.values(favs).sort(function (a, b) {
                    return new Date(b.published_at || 0) - new Date(a.published_at || 0);
                });
                grid.innerHTML = "";
                if (!items.length) {
                    empty.style.display = "";
                    return;
                }
                empty.style.display = "none";
                items.forEach(function (a) {
                    var node = tpl.content.firstElementChild.cloneNode(true);
                    var link = node.querySelector(".card-link");
                    link.href = "/article.html?slug=" + encodeURIComponent(a.slug);
                    var media = node.querySelector(".card-media");
                    if (a.cover_image_url) {
                        node.querySelector(".card-img").src = a.cover_image_url;
                    } else {
                        media.style.display = "none";
                    }
                    node.querySelector(".card-date").textContent = formatDate(a.published_at);
                    node.querySelector(".card-title").textContent = a.title;
                    var lead = node.querySelector(".card-lead");
                    if (a.subtitle) { lead.textContent = a.subtitle; } else { lead.remove(); }
                    node.querySelector(".author-name").textContent = a.author_name || "";
                    // кнопка убрать
                    node.querySelector(".fav-remove").addEventListener("click", function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        var data = getFavorites();
                        delete data[a.slug];
                        saveFavorites(data);
                        render();
                    });
                    grid.appendChild(node);
                });
            }

            document.addEventListener("DOMContentLoaded", function () {
                var y = document.getElementById("year");
                if (y) y.textContent = new Date().getFullYear();
                render();
            });
        })();
    </script>
</body>
</html>
