<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статья — БОГЕМА</title>
    <meta name="description" content="Статья журнала БОГЕМА.">
    <!-- Open Graph / соцсети (обновляются динамически в article.js) -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="БОГЕМА">
    <meta property="og:title" id="og-title" content="Статья — БОГЕМА">
    <meta property="og:description" id="og-description" content="Статья журнала БОГЕМА.">
    <meta property="og:image" id="og-image" content="">
    <meta property="og:url" id="og-url" content="/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" id="canonical" href="/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap">
    <link rel="stylesheet" href="/assets/css/styles.css?v=25">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📰</text></svg>">
    <script>
        // Apply theme before first paint to avoid flash. theme.js wires up the toggle.
        (function () {
            try {
                var t = localStorage.getItem("media-theme");
                if (t !== "light" && t !== "dark") {
                    t = (window.matchMedia &&
                         window.matchMedia("(prefers-color-scheme: dark)").matches)
                        ? "dark" : "light";
                }
                document.documentElement.setAttribute("data-theme", t);
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="brand">БОГЕМА</a>
            <nav class="section-nav" id="section-nav" aria-label="Разделы"></nav>
            <div class="header-tools">
                <button id="theme-toggle" class="icon-btn" type="button"
                        aria-label="Переключить тему" title="Переключить тему">
                    <span class="theme-icon" data-icon="sun" aria-hidden="true">☀</span>
                    <span class="theme-icon" data-icon="moon" aria-hidden="true">☾</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <article id="article" class="article">
            <div id="article-loading" class="article-loading">
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line short"></div>
                <div class="skeleton skeleton-cover"></div>
                <div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line"></div>
                <div class="skeleton skeleton-line short"></div>
            </div>

            <div id="article-error" class="feed-error" role="alert" hidden>
                <p>Статья не найдена или ещё не опубликована.</p>
                <p><a href="/" class="btn-outline">Вернуться на главную</a></p>
            </div>

            <div id="article-content" hidden>
                <header class="article-header">
                    <div class="card-meta">
                        <a id="article-section" class="section-badge" hidden href="/"></a>
                        <span id="article-date" class="card-date"></span>
                    </div>
                    <h1 id="article-title" class="article-title"></h1>
                    <p id="article-subtitle" class="article-subtitle"></p>
                    <div id="article-author" class="article-byline">
                        <img id="author-avatar" class="author-avatar author-avatar-lg" src="" alt="" loading="lazy">
                        <span class="author-name author-name-lg" id="author-name"></span>
                    </div>
                </header>

                <div id="article-cover" class="article-cover" hidden>
                    <img id="cover-img" src="" alt="" loading="lazy">
                </div>

                <div id="article-body" class="article-body markdown-body"></div>

                <div id="article-tags" class="article-tags" hidden></div>

                <div class="article-actions">
                    <button id="like-btn" class="action-btn like-btn" type="button" aria-label="Нравится" hidden>
                        <svg class="like-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <path d="M12 21s-7.5-4.6-10-9.3C.6 8.8 2 5.5 5.2 5.5c2 0 3.3 1.1 4.1 2.4l2.7 4 2.7-4c.8-1.3 2.1-2.4 4.1-2.4 3.2 0 4.6 3.3 3.2 6.2C19.5 16.4 12 21 12 21z"/>
                        </svg>
                        <span class="like-count" id="like-count">0</span>
                    </button>
                    <button id="fav-btn" class="action-btn fav-btn" type="button" aria-label="В избранное" hidden>
                        <svg class="fav-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        <span class="action-label">Избранное</span>
                    </button>
                    <div class="share-group" id="share-group" hidden>
                        <button class="action-btn share-btn" type="button" data-share="telegram" aria-label="Поделиться в Telegram">Telegram</button>
                        <button class="action-btn share-btn" type="button" data-share="vk" aria-label="Поделиться во ВКонтакте">ВКонтакте</button>
                        <button class="action-btn share-btn" type="button" data-share="copy" aria-label="Копировать ссылку">Копировать</button>
                    </div>
                </div>

                <section id="article-images" class="article-gallery" hidden aria-label="Галерея"></section>

                <section id="article-footnotes" class="footnotes" hidden aria-label="Сноски">
                    <h2 class="footnotes-title">Сноски</h2>
                    <ol id="footnotes-list" class="footnotes-list"></ol>
                </section>

                <section id="related-articles" class="related" hidden aria-label="Читайте по теме">
                    <h2 class="related-title">Читайте по теме</h2>
                    <div class="related-grid" id="related-grid"></div>
                </section>
            </div>
        </article>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <span>© <span id="year"></span> БОГЕМА</span>
            <nav class="footer-links">
                <a href="/">Главная</a>
                <a href="/favorites.html">Избранное</a>
            </nav>
        </div>
    </footer>

    <!-- Markdown-рендеринг и санитизация (самохостинг, без CDN) -->
    <script src="/assets/vendor/marked.min.js?v=25"></script>
    <script src="/assets/vendor/purify.min.js?v=25"></script>
    <script src="/assets/js/theme.js?v=25"></script>
    <script src="/assets/js/api.js?v=25"></script>
    <script src="/assets/js/article.js?v=25"></script>
</body>
</html>
